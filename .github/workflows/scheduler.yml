name: Daily Corpus Scheduler

on:
  schedule:
    - cron: '30 4 * * *' # 10:00 AM IST is 4:30 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ppfas-faq-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      
      - name: Run ingestion pipeline
        run: python ingest.py
        
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f corpus/chunks/ embeddings/chroma_db/
          git diff-index --quiet HEAD || git commit -m "chore: Daily update of corpus and embeddings"
          git push
